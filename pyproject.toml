[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docnlp-project"
version = "0.1.0"
description = "Document processing and NLP toolkit"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Nandini Kori" }]
license = { text = "NGK" }
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "python-docx>=1.2.0"
]

[project.optional-dependencies]
nlp = [
    "spacy>=3.7.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "black>=24.0.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
